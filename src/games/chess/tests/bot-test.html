<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot vs Bot – Dashboard v5</title>
<style>
:root{--bg:#0e1015;--p:#171a22;--p2:#1d212c;--ln:#2a3040;--fg:#e8ebf2;--mu:#8a93a8;--ok:#4ade80;--er:#f87171;--wn:#fbbf24;--ac:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;min-height:54px;border-bottom:1px solid var(--ln);background:var(--p);position:sticky;top:0;z-index:10}
h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
.sp{flex:1}.muted{color:var(--mu)}
#badges{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.badge{padding:2px 10px;border-radius:999px;background:#262c3b;border:1px solid var(--ln);font-size:12px;white-space:nowrap}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--wn)}.badge.err{color:var(--er)}.badge.acc{color:var(--ac)}
button,select,input{font:inherit;color:var(--fg);background:#232938;border:1px solid var(--ln);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:#2a4a78;border-color:#3b6cb0}.danger{background:#5a2323;border-color:#8a3a3a}
.layout{display:grid;grid-template-columns:minmax(320px,540px) 1fr;gap:12px;padding:12px;align-items:start}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
#ui-host{min-height:360px;background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:8px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;min-width:0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--mu);display:flex;gap:8px;align-items:center}
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.form label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mu)}
.form label.row{flex-direction:row;align-items:center;gap:6px;font-size:12px;color:var(--fg)}
.form input[type=number]{width:105px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin:6px 0 10px;font-size:12px}
.sc{display:flex;align-items:baseline;gap:6px}.sc b{font-size:24px}.sc small{color:var(--mu)}
.stack{display:flex;height:20px;border-radius:10px;overflow:hidden;background:#262c3b}.stack i{display:block;height:100%}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #888;margin-right:6px;vertical-align:middle;flex:none}
.dot.w{background:#fff}.dot.b{background:#000}
.turnbar{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;padding:8px 10px;margin-bottom:8px;background:var(--p2);border-radius:8px;border:1px solid var(--ln);min-height:44px}
.live{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;flex:1;min-width:230px}.kv .k{color:var(--mu)}.kv .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-word}
.progress{height:5px;background:#262c3b;border-radius:3px;margin-top:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--ac)}
.scroll{overflow:auto;max-height:280px}#cur-moves{height:280px}#cur-moves.dim{opacity:.45}
#games{height:340px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{color:var(--mu);font-weight:500;position:sticky;top:0;background:var(--p)}
tr.sel td{background:#223049}tr.click{cursor:pointer}tr.click:hover td{background:#1f2636}
td.pick{cursor:pointer}td.pick:hover{background:#1f2636}td.cur{outline:2px solid var(--ac);outline-offset:-2px}
td .t{color:var(--mu);font-size:11px;margin-left:6px}td .t.slow{color:var(--wn)}
.mc{display:inline-flex;gap:6px;align-items:baseline}.mc .pc{font-size:17px}.mv{font-family:ui-monospace,Menlo,Consolas,monospace}
.wb{display:inline-block;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.wb.w{background:#f1f3f8;color:#111}.wb.b{background:#0b0d12;color:#fff;border:1px solid #667}.wb.draw{background:#14502d;color:var(--ok)}.wb.x{background:#5a4a1f;color:var(--wn)}
.pc{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",sans-serif;line-height:1}
.pc.w{color:#fff;text-shadow:0 0 1px #000,0 0 2px #000,0 0 3px #000}.pc.b{color:#0b0c10;text-shadow:0 0 1px #fff,0 0 2px rgba(255,255,255,.55)}
.board{display:grid;border:2px solid #3a4258;border-radius:4px;overflow:hidden;flex:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;line-height:1;user-select:none}
.sq.lt{background:#e4d8bb}.sq.dk{background:#a9825f}.sq.from{background:#d8d86a}.sq.to{background:#7fd18b}
.sq i{position:absolute;font-style:normal;font-size:9px;color:#5a4a38;opacity:.85;line-height:1}.sq i.rk{top:1px;left:2px}.sq i.fl{bottom:1px;right:2px}
.replay{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin:8px 0}.rctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.rctl input{width:200px;padding:0}.rcap{font-family:ui-monospace,monospace;font-size:12.5px}
.strip{display:flex;align-items:flex-end;flex-wrap:wrap;gap:2px;margin-bottom:8px;min-height:30px}
.strip .cell{width:9px;border-radius:2px;cursor:pointer;opacity:.8}.strip .cell:hover{opacity:1}.strip .cell.sel{outline:2px solid var(--ac);opacity:1}
.agg{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;min-height:200px}
.pbar{display:flex;align-items:center;gap:8px;margin:4px 0}.pbar .pc{font-size:20px;width:22px;text-align:center}.pbar .trk{flex:1;min-width:120px}
.pbar .trk i{display:block;height:7px;margin:1px 0;border-radius:3px}.pbar b{font-weight:400;color:var(--mu);font-size:11px;min-width:64px}
.mini{display:block;height:6px;border-radius:3px;background:var(--ac);min-width:2px}
details>summary{cursor:pointer;color:var(--mu)}
#log{height:240px;overflow:auto;margin-top:6px}#log.nomv .lg.move{display:none}
.lg{display:flex;gap:8px;font-size:12px;border-bottom:1px solid #20263a;padding:1px 0}.lg .tm{color:var(--mu);font-family:ui-monospace,monospace;flex:none}.lg .tg{flex:none;width:44px;color:var(--mu)}
.lg.warn{color:var(--wn)}.lg.error{color:var(--er)}.lg.game{font-weight:600}
</style>
</head>
<body>
<header>
  <h1>♟ Bot vs Bot <small style="color:var(--ac)">v5</small></h1>
  <div id="badges"></div><span class="sp"></span>
  <button id="b-auto" class="primary">Auto: BẬT</button>
  <button id="b-rs">Restart ngay</button>
  <button id="b-dx" class="danger">destroy()</button>
</header>
<section class="card" id="score" style="margin:12px 12px 0;min-height:84px"></section>
<main class="layout">
  <section class="col">
    <div id="ui-host"></div>
    <div class="card"><h2>Cấu hình</h2>
      <div class="form">
        <label>Chờ trước khi restart (ms)<input id="c-dl" type="number" min="0" value="0"></label>
        <label>Dừng sau N ván (0 = vô hạn)<input id="c-max" type="number" min="0" value="0"></label>
        <label>Giới hạn nước/ván (0 = tắt)<input id="c-mp" type="number" min="0" value="0"></label>
        <label>Watchdog kẹt (giây, 0 = tắt)<input id="c-wd" type="number" min="0" value="30"></label>
        <label>Tự xoá log sau N ván (0 = tắt)<input id="c-clr" type="number" min="0" value="55"></label>
        <label>botDelay của bot (ms)<input id="c-bd" type="number" min="0"></label>
        <button id="b-bd" class="primary" title="botDelay chỉ nhận lúc create() nên cần tải lại trang">Áp dụng &amp; tải lại</button>
      </div>
    </div>
  </section>
  <section class="col">
    <div class="card"><h2>Ván đang chạy <span id="lv-t" class="muted"></span></h2>
      <div id="turnbar" class="turnbar"></div>
      <div class="live">
        <div class="kv">
          <div class="k">Số nước đã đi</div><div class="v" id="lv-ply">—</div>
          <div class="k">Nước vừa đi</div><div class="v" id="lv-last">—</div>
          <div class="k">Bot đang nghĩ</div><div class="v" id="lv-think">—</div>
          <div class="k">Thời gian ván</div><div class="v" id="lv-el">—</div>
          <div class="k">TB ms/nước</div><div class="v" id="lv-avg">—</div>
          <div class="k">view.result</div><div class="v" id="lv-res">chưa có</div>
        </div>
        <div id="live-board"></div>
      </div>
      <div class="progress" title="Số nước / giới hạn"><i id="pg"></i></div>
    </div>
    <div class="card"><h2>Nước đi (ván đang chạy)</h2><div id="cur-moves" class="scroll"></div></div>
    <div class="card"><h2>Thống kê</h2><div id="stats"></div></div>
    <div class="card">
      <h2>Sơ đồ tổng hợp nước đi <span id="agg-meta" class="muted"></span></h2>
      <div class="form" style="margin-bottom:8px">
        <label>Hiển thị<select id="agg-metric"><option value="to">Ô quân đi đến</option><option value="from">Ô quân xuất phát</option><option value="cap">Ô bắt quân</option></select></label>
        <label>Bên<select id="agg-side"><option value="all">Cả hai</option><option value="w">Trắng</option><option value="b">Đen</option></select></label>
        <label class="row"><input id="agg-arrows" type="checkbox" checked> Mũi tên top 10 nước hay đi</label>
      </div>
      <div id="agg" class="agg"></div>
    </div>
    <div class="card"><h2>Các ván đã lưu <span id="games-meta" class="muted"></span><span class="sp"></span><button id="b-clr">Xoá lịch sử</button></h2><div id="games"></div></div>
    <div class="card"><h2>Chi tiết &amp; phát lại ván đã chọn</h2><div id="detail"></div></div>
    <details class="card"><summary>Log</summary>
      <label style="font-size:12px"><input type="checkbox" id="lg-mv"> hiện từng nước đi</label>
      <button id="lg-x" style="float:right">Xoá</button>
      <div id="log" class="nomv"></div>
    </details>
  </section>
</main>

<script type="module">
import chess, { GameMode } from "../index.js";

/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safe = (v) => { const seen = new WeakSet(); try { return JSON.stringify(v, (k, x) => { if (typeof x === "function") return "[fn]"; if (typeof x === "bigint") return x + "n"; if (x && typeof x === "object") { if (seen.has(x)) return "[Circular]"; seen.add(x); } return x; }); } catch { return String(v); } };
const clone = (v) => { if (v === undefined) return null; try { return JSON.parse(safe(v)); } catch { return String(v); } };
const short = (v, n = 40) => { const s = v == null ? "—" : typeof v === "string" ? v : safe(v); return s.length > n ? s.slice(0, n) + "…" : s; };
const fmtDur = (ms) => { if (ms == null) return "—"; if (ms < 1000) return Math.round(ms) + "ms"; const s = ms / 1000; return s < 60 ? s.toFixed(1) + "s" : Math.floor(s / 60) + "m" + String(Math.round(s % 60)).padStart(2, "0") + "s"; };
const fmtMs = (ms) => ms == null ? "—" : ms >= 1000 ? (ms / 1000).toFixed(2) + "s" : Math.round(ms) + "ms";
const setT = (sel, t) => { const e = $(sel); if (e.textContent !== t) e.textContent = t; };
const loadJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k) ?? "null") ?? d; } catch { return d; } };
const cfg = (id, d = 0) => { const n = Number($(id).value); return Number.isFinite(n) && n >= 0 ? Math.floor(n) : d; };
const label = (s) => s === "w" ? "Trắng" : s === "b" ? "Đen" : "?";

/* ===== cấu hình ===== */
const DKEY = "chess-bot-test:v4:botDelay", GKEY = "chess-bot-test:v4:games", AKEY = "chess-bot-test:v5:agg";
const BOT_DELAY = (() => { const r = localStorage.getItem(DKEY), n = Number(r); return r != null && r !== "" && Number.isFinite(n) && n >= 0 ? Math.floor(n) : 0; })();
const NO_RESULT = new Set(["", "none", "ongoing", "playing", "in_progress", "in-progress", "active"]);
const isResult = (v) => !(v == null || v === false || (typeof v === "string" && NO_RESULT.has(v.trim().toLowerCase())));
const WIN_LABEL = { w: "Trắng thắng", b: "Đen thắng", draw: "Hòa", unknown: "Không rõ", stuck: "Kẹt", maxmoves: "Quá dài" };
const WIN_FILL = { w: "#f1f3f8", b: "#6b7390", draw: "#4ade80" };
const wLabel = (k) => WIN_LABEL[k] ?? String(k);
const wbadge = (k) => el("span", "wb " + ({ w: "w", b: "b", draw: "draw" }[k] ?? "x"), wLabel(k));

/* ===== đọc view ===== */
const sideKey = (t) => { if (t == null) return null; const s = String(typeof t === "object" ? (t.color ?? t.side ?? t.name ?? safe(t)) : t).toLowerCase().trim(); return ["w", "white", "trắng"].includes(s) ? "w" : ["b", "black", "đen"].includes(s) ? "b" : null; };
function pick(o, keys, ok = () => true) {
  if (!o || typeof o !== "object") return null;
  for (const k of keys) if (k in o && o[k] !== undefined && ok(o[k])) return { key: k, value: o[k] };
  for (const [pk, sub] of Object.entries(o)) if (sub && typeof sub === "object" && !Array.isArray(sub)) for (const k of keys) if (k in sub && sub[k] !== undefined && ok(sub[k])) return { key: pk + "." + k, value: sub[k] };
  return null;
}
const moveText = (m) => typeof m === "string" ? m : m && typeof m === "object" ? (m.san || (m.from != null && m.to != null ? `${safe(m.from)}→${safe(m.to)}` : m.uci || m.notation) || safe(m)) : String(m);
const GL = Object.fromEntries(Object.entries({ p: "♟", n: "♞", b: "♝", r: "♜", q: "♛", k: "♚" }).map(([k, v]) => [k, v + "\uFE0E"]));
const TC = [["PAWN", "p"], ["KNIGHT", "n"], ["BISHOP", "b"], ["ROOK", "r"], ["QUEEN", "q"], ["KING", "k"]];
const typeCode = (t) => { if (t == null) return "?"; const s = String(typeof t === "object" ? (t.name ?? t.type ?? safe(t)) : t).toUpperCase(); for (const [k, c] of TC) if (s.includes(k)) return c; return s.length === 1 && "PNBRQK".includes(s) ? s.toLowerCase() : "?"; };
function readPieces(v) {
  const kv = pick(v, ["pieces", "board", "squares", "cells"], a => Array.isArray(a) && a.length && a[0] && typeof a[0] === "object" && !Array.isArray(a[0]));
  if (!kv) return null;
  const it = []; let mr = 7, mc = 7;
  for (const p of kv.value) {
    if (!p || typeof p !== "object" || p.captured === true || p.dead === true || p.removed === true || p.alive === false) continue;
    const r = Number(p.row ?? p.r ?? p.y ?? p.rank), c = Number(p.col ?? p.c ?? p.x ?? p.column ?? p.file);
    if (!Number.isInteger(r) || !Number.isInteger(c) || r < 0 || c < 0 || r > 31 || c > 31) continue;
    it.push({ r, c, k: typeCode(p.type ?? p.kind ?? p.piece ?? p.name), w: sideKey(p.side ?? p.color ?? p.player ?? p.owner) === "w" });
    mr = Math.max(mr, r); mc = Math.max(mc, c);
  }
  if (!it.length) return null;
  const n = Math.max(mr, mc) + 1, a = new Array(n * n).fill(".");
  for (const x of it) a[x.r * n + x.c] = x.w ? x.k.toUpperCase() : x.k;
  return { size: n, str: a.join("") };
}
function read(v) {
  const t = pick(v, ["turn", "currentTurn", "activeColor", "sideToMove", "toMove", "currentPlayer"])
    || (() => { const f = pick(v, ["fen", "FEN", "position"], x => typeof x === "string" && /\s[wb]\s/.test(x)); return f && { value: f.value.split(/\s+/)[1] }; })();
  const h = pick(v, ["history", "moveHistory", "moves", "pgn", "log"], x => Array.isArray(x) || typeof x === "string");
  const l = pick(v, ["lastMove", "last"]);
  const res = v?.result;
  return { turn: t ? sideKey(t.value) : null, hist: h && Array.isArray(h.value) ? h.value : null, last: l && l.value != null ? moveText(l.value) : null, board: readPieces(v), res, hasRes: isResult(res) };
}
function parseResult(r, last) {
  const ns = (x) => { if (x == null) return null; const s = String(x).toLowerCase().trim(); if (["w", "white", "trắng", "1-0"].includes(s)) return "w"; if (["b", "black", "đen", "0-1"].includes(s)) return "b"; if (["draw", "drawn", "tie", "stalemate", "1/2-1/2", "½-½", "="].includes(s)) return "draw"; return null; };
  let w = null, reason = null;
  if (r && typeof r === "object") {
    for (const k of ["winner", "winnerColor", "winningSide", "victor"]) { w = ns(r[k]); if (w) break; }
    if (!w && (r.draw === true || r.isDraw === true)) w = "draw";
    if (!w) for (const k of ["outcome", "status", "type", "kind", "result"]) { w = ns(r[k]); if (w) break; }
    const rs = r.reason ?? r.type ?? r.kind ?? r.by ?? r.status ?? r.outcome ?? null;
    reason = rs == null ? null : typeof rs === "object" ? safe(rs) : String(rs);
  } else { w = ns(r); reason = String(r); }
  const t = (r && typeof r === "object" ? safe(r) : String(r)).toLowerCase();
  if (!w) { if (/draw|stalemate|\btie\b|1\/2|½|insufficient|repetition|fifty|hòa/.test(t)) w = "draw"; else if (/white[\s_-]*(wins?|won)|trắng\s*thắng|\b1-0\b/.test(t)) w = "w"; else if (/black[\s_-]*(wins?|won)|đen\s*thắng|\b0-1\b/.test(t)) w = "b"; }
  if (!w && /mate/.test(t) && (last === "w" || last === "b")) w = last;
  if (!w) { const hw = /white|trắng/.test(t), hb = /black|đen/.test(t); if (hw !== hb) { const n = hw ? "w" : "b"; w = /loser|losing|mated|lost/.test(t) ? (n === "w" ? "b" : "w") : n; } }
  return { winner: w ?? "unknown", reason };
}

/* ===== so 2 bàn cờ → nước đi ===== */
const colOf = (ch) => ch === ch.toUpperCase() ? "w" : "b";
const fileN = (c) => c < 26 ? "abcdefghijklmnopqrstuvwxyz"[c] : String(c);
const sq = (i, n) => fileN(i % n) + (n - Math.floor(i / n));
const diffCount = (a, b) => { let n = 0; for (let i = 0; i < Math.max(a.length, b.length); i++) if (a[i] !== b[i]) n++; return n; };
function deriveMoves(a, b, n, turn) {
  const gone = [], add = [];
  for (let i = 0; i < a.length; i++) { if (a[i] === b[i]) continue; if (a[i] !== ".") gone.push(i); if (b[i] !== ".") add.push(i); }
  const sides = [...new Set(add.map(i => colOf(b[i])))];
  if (!sides.length) return [];
  const order = sides.length === 2 ? (turn === "b" ? ["b", "w"] : ["w", "b"]) : sides;
  return order.map(c => extract(c, a, b, gone, add, n));
}
function extract(c, a, b, gone, add, n) {
  const mA = add.filter(i => colOf(b[i]) === c), mG = gone.filter(i => colOf(a[i]) === c), fG = gone.filter(i => colOf(a[i]) !== c);
  const r = { side: c, from: null, to: null, piece: null, cap: null, promo: null, castle: null, ep: false, unc: false, amend: false };
  const kT = mA.find(i => b[i].toLowerCase() === "k"), kF = mG.find(i => a[i].toLowerCase() === "k");
  if (mA.length === 2 && mG.length === 2 && kT != null && kF != null) { r.from = kF; r.to = kT; r.piece = "k"; r.castle = (kT % n) > (kF % n) ? "O-O" : "O-O-O"; return r; }
  if (mA.length === 1 && mG.length === 1) {
    r.from = mG[0]; r.to = mA[0]; r.piece = a[r.from].toLowerCase();
    const af = b[r.to].toLowerCase(); if (af !== r.piece) r.promo = af;
    if (r.from === r.to) { r.amend = true; return r; }
    if (fG.includes(r.to)) r.cap = a[r.to].toLowerCase(); else if (fG.length === 1) { r.cap = a[fG[0]].toLowerCase(); r.ep = true; }
    return r;
  }
  r.unc = true; r.from = mG[0] ?? null; r.to = mA[0] ?? null;
  r.piece = r.to != null ? b[r.to].toLowerCase() : (r.from != null ? a[r.from].toLowerCase() : null);

      const [f, t] = k.slice(1).split(">").map(Number), x1 = (f % n + .5) * C, y1 = (Math.floor(f / n) + .5) * C, x2 = (t % n + .5) * C, y2 = (Math.floor(t / n) + .5) * C;
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1d4ed8" stroke-width="${1 + 3 * v / pm}" stroke-opacity=".75" marker-end="url(#ah)"><title>${esc(sq(f, n) + "→" + sq(t, n))}: ${v} lần</title></line>`;
    }
  }
  s += "</svg>";
  const pmx = Math.max(1, ...["w", "b"].flatMap(k => Object.values(a.pc[k]))); let p = "";
  for (const t of "pnbrqk") { const w = a.pc.w[t] || 0, b = a.pc.b[t] || 0; p += `<div class="pbar"><span class="pc w">${GL[t]}</span><div class="trk"><i style="width:${w / pmx * 100}%;background:#f1f3f8"></i><i style="width:${b / pmx * 100}%;background:#6b7390"></i></div><b>${w} · ${b}</b></div>`; }
  p = `<div style="flex:1;min-width:200px"><div class="muted">Nước đi theo loại quân (sáng = Trắng, xám = Đen)</div>${p}<div class="legend"><span>🎯 Bắt quân ${a.capt}</span><span>♚ Nhập thành ${a.castle}</span><span>♛ Phong cấp ${a.promo}</span></div></div>`;
  host.innerHTML = s + p;
}
function renderGames() {
  const host = $("#games"), st = host.scrollTop, gs = S.games; host.replaceChildren();
  $("#games-meta").textContent = `(${gs.length} ván · bấm vào ván để xem nước đi)`;
  if (!gs.length) { host.append(el("span", "muted", "Chưa có ván nào kết thúc.")); return; }
  const strip = el("div", "strip");
  for (const g of gs.slice(-300)) {
    const c = el("div", "cell" + (g.id === S.sel ? " sel" : "")); c.style.cssText = `background:${WIN_FILL[g.winner] ?? "#fbbf24"};height:${6 + Math.min(24, (g.plies || 0) / 5)}px`;
    c.title = `#${g.id} · ${wLabel(g.winner)} · ${g.plies ?? "?"} nước`; c.onclick = () => pickGame(g.id); strip.append(c);
  }
  host.append(strip);
  const mxp = Math.max(1, ...gs.map(g => g.plies || 0)), t = document.createElement("table");
  t.innerHTML = "<tr><th>#</th><th>Kết quả</th><th>Số nước</th><th>Thời gian</th></tr>";
  for (const g of [...gs].reverse().slice(0, 200)) {
    const tr = document.createElement("tr"); tr.className = "click" + (g.id === S.sel ? " sel" : "");
    const tdW = document.createElement("td"); tdW.append(wbadge(g.winner));
    const tdP = document.createElement("td"), bar = el("i", "mini"); bar.style.width = (g.plies || 0) / mxp * 100 + "%"; tdP.append(el("span", "muted", String(g.plies ?? "?")), bar);
    tr.append(el("td", null, String(g.id)), tdW, tdP, el("td", null, fmtDur(g.durationMs))); tr.onclick = () => pickGame(g.id); t.append(tr);
  }
  host.append(t); host.scrollTop = st;
}
function pickGame(id) { S.sel = id; renderGames(); renderDetail(); }
function renderDetail() {
  clearInterval(S.rp); S.rp = null;
  const h = $("#detail"); h.replaceChildren();
  const g = S.games.find(x => x.id === S.sel);
  if (!g) { h.append(el("span", "muted", "Bấm vào một ván ở trên để xem nước đi và phát lại.")); return; }
  const hd = el("div"); hd.append(wbadge(g.winner), document.createTextNode(` ván #${g.id} · ${g.reason ?? "—"} · ${g.plies ?? "?"} nước · ${fmtDur(g.durationMs)}`)); h.append(hd);
  const mv = g.moves;
  if (!mv || !mv.length) { h.append(el("div", "muted", "Ván này đã được rút gọn nên không còn nước đi (chỉ giữ chi tiết 40 ván gần nhất).")); return; }
  const n = mv.length, can = !!g.startBoard && mv.every(m => m.board), list = el("div", "scroll"); list.style.maxHeight = "230px";
  let show = null;
  if (can) {
    let idx = n; const rp = el("div", "replay"), bh = el("div"), cap = el("div", "rcap"), ctl = el("div", "rctl"), sl = document.createElement("input");
    sl.type = "range"; sl.min = 0; sl.max = n; sl.value = n;
    show = (i) => {
      idx = Math.max(0, Math.min(n, i)); sl.value = idx; const m = idx ? mv[idx - 1] : null;
      drawBoard(bh, m ? m.board : g.startBoard, g.size ?? 8, { px: 300, from: m?.from, to: m?.to });
      cap.textContent = m ? `Nước ${idx}/${n} · ${label(m.side)} · ${m.piece && GL[m.piece] ? GL[m.piece] + " " : ""}${m.text}` : `Thế cờ ban đầu (0/${n})`;
      list.querySelectorAll("[data-ply]").forEach(e => e.classList.toggle("cur", +e.dataset.ply === idx));
    };
    const stop = () => { clearInterval(S.rp); S.rp = null; ba.textContent = "▶ Tự chạy"; };
    const btn = (l, t, f) => { const b = el("button", null, l); b.title = t; b.onclick = f; return b; };
    const ba = btn("▶ Tự chạy", "Tự phát lại", () => { if (S.rp) { stop(); return; } if (idx >= n) show(0); ba.textContent = "⏸ Dừng"; S.rp = setInterval(() => { if (idx >= n) { stop(); return; } show(idx + 1); }, 500); });
    sl.oninput = () => { stop(); show(+sl.value); };
    ctl.append(btn("⏮", "Đầu", () => { stop(); show(0); }), btn("◀", "Lùi", () => { stop(); show(idx - 1); }), btn("▶", "Tiến", () => { stop(); show(idx + 1); }), btn("⏭", "Cuối", () => { stop(); show(n); }), ba, sl);
    rp.append(bh, ctl, cap); h.append(rp);
  }
  const ms = mv.map(m => m.dtMs ?? 0), mx = Math.max(50, ...ms), bw = 420 / n; let svg = `<svg viewBox="0 0 420 60" width="100%" height="60" preserveAspectRatio="none">`;
  mv.forEach((m, i) => { const hh = Math.max(1, ms[i] / mx * 58); svg += `<rect x="${(i * bw).toFixed(1)}" y="${(60 - hh).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${hh.toFixed(1)}" fill="${m.side === "w" ? "#f1f3f8" : "#6b7390"}"><title>${esc(`nước ${m.ply} · ${m.text} · ${fmtMs(m.dtMs)}`)}</title></rect>`; });
  const ch = el("div"); ch.innerHTML = svg + `</svg><div class="muted" style="font-size:11px">Thời gian mỗi nước (trắng = Trắng, xám = Đen) · cao nhất ${fmtMs(mx)}</div>`;
  h.append(ch, list);
  moveTable(list, mv, can ? (p) => { clearInterval(S.rp); S.rp = null; show(p); } : null, false);
  if (show) show(n);
}

/* ===== poll: timer, watchdog, safety net ===== */
const timerId = setInterval(() => {
  if (S.dead || !S.cur) return; timers(); renderBadges(); if (S.restarting) return;
  const v = controller.getView(), now = performance.now();
  if (v !== S.seen) { S.unseen ??= now; if (now - S.unseen > 600) { log("warn", "getView() đổi nhưng subscribe không gọi — xử lý bù"); onView(); } } else S.unseen = null;
  if (S.pend && now - S.pend > 2000) { S.pend = null; if (read(v).hasRes) { S.errors++; log("error", "restart() không xoá được view.result sau 2s — tắt auto"); setAuto(false); } }
  const g = S.cur, lim = cfg("#c-wd", 30) * 1000;
  if (g.fin || !lim || S.wd) return;
  const idle = now - S.tick; if (idle <= lim) return;
  S.wd = true; log("warn", `Ván #${g.id}: ${Math.round(idle / 1000)}s không đổi view — bot có thể bị kẹt`);
  if (S.auto) { finish({ winner: "stuck", reason: `không đổi view ${Math.round(idle / 1000)}s`, raw: { stuck: true } }); schedule(); }
}, 250);

/* ===== nút bấm ===== */
$("#b-auto").onclick = () => setAuto(!S.auto);
$("#b-rs").onclick = () => doRestart(true);
$("#b-clr").onclick = () => {
  S.games = []; S.sel = null; S.agg = null; S.hold = null;
  try { localStorage.removeItem(GKEY); localStorage.removeItem(AKEY); } catch {}
  log("game", "Đã xoá lịch sử các ván"); slowSig = ""; renderScore(); renderStats(); renderGames(); renderAgg(); renderDetail();
};
$("#lg-x").onclick = () => { $("#log").replaceChildren(); S.sinceClr = 0; };
$("#lg-mv").onchange = (e) => $("#log").classList.toggle("nomv", !e.target.checked);
for (const id of ["#agg-metric", "#agg-side", "#agg-arrows"]) $(id).addEventListener("change", renderAgg);
$("#b-dx").onclick = () => {
  if (S.dead) return;
  clearTimeout(S.rT); clearInterval(timerId); clearInterval(S.rp);
  try { unsub(); unsubErr(); } catch {}
  controller.destroy(); S.dead = true;
  for (const id of ["#b-auto", "#b-rs", "#b-dx"]) $(id).disabled = true;
  log("sys", "Đã gọi controller.destroy()"); renderBadges();
};
$("#c-bd").value = String(BOT_DELAY);
const applyBD = () => { const n = cfg("#c-bd"); try { localStorage.setItem(DKEY, String(n)); } catch {} location.reload(); };
$("#b-bd").onclick = applyBD;
$("#c-bd").onkeydown = (e) => { if (e.key === "Enter") applyBD(); };

/* ===== khởi động ===== */
log("sys", `Controller đã tạo (botDelay ${BOT_DELAY}ms) · actions: ${Object.keys(controller.actions ?? {}).join(", ") || "(không có)"}`);
startGame("khởi tạo");
if (S.prev.hasRes) { log("warn", "Mở trang mà view.result đã có giá trị"); checkEnd(S.prev); }
render(); renderDetail();
const host = $("#ui-host");
try { const ui = await chess.loadUI(); ui.mount(host, controller); log("sys", "UI đã mount"); }
catch (e) { log("error", "Mount UI thất bại: " + (e?.message ?? e)); }
</script>
</body>
