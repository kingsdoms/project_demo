    //////////////////////////////////ROOM TEST
    import assert from "node:assert/strict";
    import { Room } from "../core/engine/room.js";
    import { Action } from "../core/models/Action.js";
    import { Side } from "../core/constants/Side.js";

    const fake = (game, action) => {
      if (action.row === 99) throw new Error("nước sai");
      return game.withTurn(game.turn === Side.WHITE ? Side.BLACK : Side.WHITE);
    };

    const room = new Room(fake);
    let calls = 0;
    room.subscribe(() => calls++);

    const before = room.getState();
    assert.throws(() => room.dispatch(Action.move("x", 99, 0)));
    assert.strictEqual(room.getState(), before); // sai thì state không đổi
    assert.equal(calls, 0);

    room.dispatch(Action.move("x", 1, 1));
    assert.notStrictEqual(room.getState(), before);
    assert.equal(calls, 1);

    room.restart();
    assert.equal(room.getState().turn, Side.WHITE);

    room.destroy();
    assert.throws(() => room.dispatch(Action.move("x", 1, 1)));
    console.log("room OK");
  </script>
