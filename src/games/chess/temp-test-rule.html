  <script type="module">
    import { RuleSet } from "./core/models/RuleSet.js";
    import { Rule } from "./core/models/Rule.js";
    import { Piece } from "./core/models/Piece.js";
    import { PieceType } from "./constants/PieceType.js";
    import { Side } from "./constants/Side.js";

    const PROMOTE_TARGETS = Object.freeze([
      PieceType.QUEEN,
      PieceType.ROOK,
      PieceType.BISHOP,
      PieceType.KNIGHT,
    ]);
    const LAST_RANK = Object.freeze({
      [Side.WHITE]: 0,
      [Side.BLACK]: 7,
    });
    //
    const pieceRules = new RuleSet();
    const piece = new Piece({
      id: "p1",
      type: PieceType.PAWN,
      side: Side.BLACK,
      row: 5,
      col: 0,
    });
    //Tọa độ logic: Trắng luôn đi từ hàng 6 về hàng 0, Đen đi từ hàng 1 về hàng 7.

    pieceRules.add(
      "PROMOTE",
      new Rule()
        .setType("pieceType", PieceType)
        .setValueEqual("pieceType", PieceType.PAWN, "Chỉ tốt được phong cấp")
        .setCheck(
          ["piece"],
          ({ piece }) => piece.row === LAST_RANK[piece.side],
          "Tốt chưa tới hàng cuối",
        )
        .setValueIn(
          "newPieceType",
          PROMOTE_TARGETS,
          "Không được phong thành quân này",
        ),
    );
    //
    console.log(pieceRules.get("PROMOTE"));
    console.log(pieceRules.get("PROMOTE").getValueIn("newPieceType"));
    console.log(
      pieceRules.get("PROMOTE").check({
        pieceType: piece.type,
        piece: piece,
        newPieceType: PieceType.KNIGHT,
      }),
    );
  </script>
  <!-- GAME RULES -->
  <script type="module">
    import { RuleSet } from "./core/models/RuleSet.js";
    import { Rule } from "./core/models/Rule.js";
    export const gameRules = new RuleSet();

    // Chỉ bên đang tới lượt được đi quân của mình
    gameRules.add(
      "TURN",
      new Rule().setCheck(
        ["piece", "turn"],
        ({ piece, turn }) => piece.side === turn,
        "Không phải lượt của bạn",
      ),
    );

    // Ván đã kết thúc thì không nhận nước nào nữa
    gameRules.add(
      "GAME_NOT_OVER",
      new Rule().setValueEqual("state.result", null, "Ván đã kết thúc"),
    );

    // Tốt vừa tới hàng cuối thì phải phong trước, mọi nước khác bị chặn
    gameRules.add(
      "PROMOTION_PENDING",
      new Rule().setValueEqual(
        "move.blockedByPromotion",
        false,
        "Phải phong cấp quân trước",
      ),
    );
  </script>
  <!-- BOARD RULES -->
  <script type="module">
    import { RuleSet } from "./core/models/RuleSet.js";
    import { Rule } from "./core/models/Rule.js";
    export const boardRules = new RuleSet();

    // Ô đích phải nằm trong bàn
    boardRules.add(
      "IN_BOARD",
      new Rule().setValueEqual("move.inBoard", true, "Ô đích nằm ngoài bàn"),
    );

    // Ô đích phải nằm trong nước đi của quân theo luật đi quân.
    // Quân không đi chéo, không nhảy, không đi qua quân khác, trừ mã.
    boardRules.add(
      "PATTERN",
      new Rule().setValueEqual(
        "move.reachable",
        true,
        "Quân này không đi tới ô đó",
      ),
    );

    // Không được ăn quân cùng bên
    boardRules.add(
      "NOT_ALLY_TARGET",
      new Rule().setValueEqual(
        "move.targetIsAlly",
        false,
        "Không được ăn quân cùng bên",
      ),
    );

    // Sau nước đi, vua bên mình không được bị chiếu
    boardRules.add(
      "NOT_SELF_CHECK",
      new Rule().setValueEqual(
        "move.exposesKing",
        false,
        "Nước đi này để vua bị chiếu",
      ),
    );

    // Nhập thành: vua và xe chưa đi, giữa hai quân không có quân nào,
    // vua không đang bị chiếu, và vua không đi qua hoặc tới ô bị chiếu
    boardRules.add(
      "CASTLE",
      new Rule()
        .setValueEqual(
          "piece.hasMoved",
          false,
          "Vua đã đi nên không nhập thành được",
        )
        .setValueEqual(
          "rook.hasMoved",
          false,
          "Xe đã đi nên không nhập thành được",
        )
        .setValueEqual("castle.pathEmpty", true, "Giữa vua và xe còn quân")
        .setValueEqual(
          "castle.inCheck",
          false,
          "Không nhập thành khi đang bị chiếu",
        )
        .setValueEqual(
          "castle.passesAttacked",
          false,
          "Vua không được đi qua hoặc tới ô bị chiếu",
        ),
    );

    // Bắt qua đường: chỉ áp dụng cho ô vừa được tốt đối phương bỏ qua,
    // và tốt bị bắt phải vừa đi hai ô ở lượt trước
    boardRules.add(
      "EN_PASSANT",
      new Rule()
        .setValueEqual(
          "passant.targetMatches",
          true,
          "Bắt qua đường chỉ áp dụng cho ô vừa được bỏ qua",
        )
        .setValueEqual(
          "passant.capturedPawnJustDoubled",
          true,
          "Tốt bị bắt phải vừa đi hai ô",
        ),
    );
  </script>
  <!-- OUTCOME RULES -->
  <script type="module">
    import { RuleSet } from "./core/models/RuleSet.js";
    import { Rule } from "./core/models/Rule.js";
    export const outcomeRules = new RuleSet();
    outcomeRules.add(
      "checkmate",
      new Rule()
        .setValueEqual("position.inCheck", true)
        .setValueEqual("position.hasLegalMove", false),
    );

    // Bên tới lượt không bị chiếu nhưng không còn nước hợp lệ: hòa
    outcomeRules.add(
      "stalemate",
      new Rule()
        .setValueEqual("position.inCheck", false)
        .setValueEqual("position.hasLegalMove", false),
    );

    // Không bên nào còn đủ quân để chiếu hết: hòa. Engine tự xác định trường hợp này.
    outcomeRules.add(
      "insufficientMaterial",
      new Rule().setValueEqual("position.insufficientMaterial", true),
    );
  </script>
